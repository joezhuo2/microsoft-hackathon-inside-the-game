[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Football tracking analytics and match intelligence engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.3.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0",
  "plotly>=5.0.0",
  "streamlit>=1.30.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
